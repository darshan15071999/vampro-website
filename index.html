<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;900&family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  
  <link rel="icon" type="image/png" href="/favicon.png?v=2" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/favicon.png" />

  <!-- Fallback SEO for SPA (Managed by react-helmet-async) -->
  <title data-rh="true">Vampro | Creativity Meets Technology</title>
  <meta data-rh="true" name="description" content="Discover Vampro's collection of AI-powered creative software, professional plugins, and productivity tools and professional services. Build faster, create better, and explore what's next." />
  <link data-rh="true" rel="canonical" href="https://vampro.in/" />
  <meta data-rh="true" name="robots" content="index,follow" />
  <meta data-rh="true" property="og:type" content="website" />
  <meta data-rh="true" property="og:title" content="Vampro | Creativity Meets Technology" />
  <meta data-rh="true" property="og:description" content="Explore Vampro's collection of AI-powered creative software, plugins and digital experiences." />
  <meta data-rh="true" property="og:image" content="https://vampro.in/thumbnail.jpg" />
  <meta data-rh="true" name="twitter:card" content="summary_large_image" />
  <meta data-rh="true" name="twitter:title" content="Vampro | Creativity Meets Technology" />
  <meta data-rh="true" name="twitter:description" content="Explore Vampro's collection of AI-powered creative software, plugins and digital experiences." />
  <meta data-rh="true" name="twitter:image" content="https://vampro.in/thumbnail.jpg" />

  <!-- Remove fallback tags before React mounts to prevent duplicates in React 19 -->
  <script>
    document.querySelectorAll('[data-rh="true"]').forEach(el => el.remove());
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
